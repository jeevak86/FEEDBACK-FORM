<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h1 class="form-title">Feedback Form</h1>
    
    <form id="feedbackForm">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="department">Department:</label>
        <input type="text" id="department" name="department" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="sessionTitle">Session Title:</label>
        <input type="text" id="sessionTitle" name="sessionTitle" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="feedback">Feedback:</label>
        <input type="text" id="feedback" name="feedback" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="suggestions">Suggestions:</label>
        <input type="text" id="suggestions" name="suggestions" autocomplete="off">
      </div>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
